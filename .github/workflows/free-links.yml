name: Update free Read/Listen links

on:
  schedule:
    - cron: '23 5 * * 1'   # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look for free copies
        run: node tools/update-free-links.mjs content/pages/books.html
      - name: Commit straight to the default branch if anything changed
        run: |
          if git diff --quiet; then echo "No changes."; exit 0; fi
          git config user.name  "kafka-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Books: refresh free Read/Listen links"
          git push origin HEAD:${{ github.event.repository.default_branch }}
