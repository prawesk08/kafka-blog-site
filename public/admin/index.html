<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kafkaintherun editor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600&family=Lora:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/quill@1.3.7/dist/quill.core.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/admin/layout.css">
  <link rel="stylesheet" href="/admin/writer.css">
  <link rel="stylesheet" href="/kafka-blocks.css">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <meta name="theme-color" content="#1f2933">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kafka editor">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/quill@1.3.7/dist/quill.min.js"></script>
  <script src="/admin/editor.js"></script>
  <script src="/admin/writer.js"></script>
  <script src="/admin/layout.js"></script>
  <script>
    // The editor signs in with GitHub through this site's own /api/auth (see worker/index.js), saves each post as a
    // file in the kafka-blog-site repo, and Cloudflare rebuilds the site about a minute later.
    CMS.init({ config: { backend: { name: 'github', repo: 'prawesk08/kafka-blog-site', branch: 'main', base_url: location.origin, auth_endpoint: 'api/auth' } } });
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/admin/sw.js", { scope: "/admin/" }).catch(function () {});</script>
</body>
</html>
